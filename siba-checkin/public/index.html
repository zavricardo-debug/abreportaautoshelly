<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check-in</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="wrap" style="max-width:460px">
  <div class="card" style="text-align:center">
    <h1>Online check-in</h1>
    <p class="lead" style="margin:10px 0 18px">Use the link you received from your host to fill in your guest registration (Boletim de Alojamento).</p>
    <div id="list"></div>
    <div class="actions" style="justify-content:center"><a class="btn small" href="/admin">Administration</a></div>
  </div>
  <footer>SIBA / AIMA · Boletins de Alojamento</footer>
</main>
<script>
// If the URL has ?p=<slug> (legacy links) forward to the guest form.
const p = new URLSearchParams(location.search).get("p");
if (p) location.replace("/r/" + encodeURIComponent(p) + (new URLSearchParams(location.search).get("c") ? "/" + new URLSearchParams(location.search).get("c") : ""));
</script>
</body>
</html>
