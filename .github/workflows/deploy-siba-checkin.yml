name: Deploy SIBA check-in to Cloudflare

# Como usar (uma vez):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#     CLOUDFLARE_API_TOKEN   token criado em dash.cloudflare.com → My Profile → API Tokens →
#                            Create Token → modelo "Edit Cloudflare Workers" + adicionar "Account · D1 · Edit"
#     CLOUDFLARE_ACCOUNT_ID  (só se a conta Cloudflare tiver acesso a mais do que uma conta)
#     ADMIN_PASSWORD         password do painel /admin (mín. 6 caracteres; obrigatória no 1.º deploy)
#   Depois: Actions → "Deploy SIBA check-in to Cloudflare" → Run workflow.
#   Cada push em main que altere siba-checkin/ volta a publicar automaticamente.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "siba-checkin/**"
      - ".github/workflows/deploy-siba-checkin.yml"

concurrency:
  group: deploy-siba-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siba-checkin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siba-checkin/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests + typecheck
        run: |
          npm test
          npx tsc --noEmit

      - name: Check repository secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta o secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions). Ver comentário no topo do workflow."
            exit 1
          fi

      - name: Create D1 + migrations + deploy Worker + secrets + SIBA self-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # opcional: domínio próprio do Worker, se o subdomínio workers.dev estiver desativado
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node tools/setup-cloudflare.mjs --ci
