name: Build APK

# Compila a app e publica o APK como artefacto do workflow.
# Corre a cada push e também à mão (separador Actions → Build APK → Run workflow).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # O projeto vive numa subpasta cujo nome tem espaços e parênteses.
      PROJ: "workspace-01a06e07-780c-7c53-807f-e100cdba93b8 (2)/ShellyDoor"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Fixa a versao da action. A flutuante (@v3) comecou a falhar em ~10 s
      # sem alteracoes do nosso lado, e sem SDK nao ha compilacao nenhuma.
      - name: Configurar Android SDK
        id: sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3.2.1
        with:
          packages: ""

      # Alternativa, caso a action volte a partir-se: instala o command-line
      # tools a mao. Assim a build deixa de depender de uma so action.
      - name: Configurar Android SDK (alternativa manual)
        if: steps.sdk.outcome == 'failure'
        run: |
          set -eux
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip && rm tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Instalar plataforma e build-tools (compileSdk 34)
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # O projeto não traz gradle wrapper, por isso instalamos o Gradle nós.
      # AGP 8.5.2 exige Gradle 8.7 ou superior.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de debug
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Compilar APK de release (não assinado)
        working-directory: ${{ env.PROJ }}
        continue-on-error: true
        run: gradle --no-daemon assembleRelease

      - name: Listar APKs gerados
        if: always()
        run: find . -name "*.apk" -exec ls -lh {} \;

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: ShellyDoor-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK de release (não assinado)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ShellyDoor-release-unsigned-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
